<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GPX Ascent Comparator</title>
<style>

  /* ---------------- Material Design 3 tokens — seed: terrain green ---------------- */
  :root {
    --md-primary:#4C662B; --md-on-primary:#FFFFFF; --md-primary-container:#CDEDA3; --md-on-primary-container:#0F2000;
    --md-secondary:#586249; --md-on-secondary:#FFFFFF; --md-secondary-container:#DCE7C8; --md-on-secondary-container:#151E0B;
    --md-tertiary:#386663; --md-on-tertiary:#FFFFFF; --md-tertiary-container:#BCECE7; --md-on-tertiary-container:#00201E;
    --md-error:#BA1A1A; --md-error-container:#FFDAD6; --md-on-error-container:#410002;
    --md-surface:#F9FAEF; --md-on-surface:#1A1C16; --md-surface-variant:#E1E4D5; --md-on-surface-variant:#44483D;
    --md-outline:#75796C; --md-outline-variant:#C5C8BA;
    --md-s-lowest:#FFFFFF; --md-s-low:#F3F4E9; --md-s:#EDEEE3; --md-s-high:#E7E9DD; --md-s-highest:#E1E3D7;
    --md-inverse-surface:#2F312A; --md-inverse-on-surface:#F1F2E6;

    /* route data colours (categorical, kept independent of the MD3 palette) */
    --a:#C47F22; --a-soft:rgba(196,127,34,.14);
    --b:#1F8F81; --b-soft:rgba(31,143,129,.14);
    --steep:#BA1A1A;

    /* shape scale */
    --r-xs:4px; --r-s:8px; --r-m:12px; --r-l:16px; --r-xl:28px; --r-full:999px;
    --shadow-1:0 1px 2px rgba(0,0,0,.10), 0 1px 3px 1px rgba(0,0,0,.06);
    --shadow-2:0 1px 2px rgba(0,0,0,.12), 0 2px 6px 2px rgba(0,0,0,.08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --md-primary:#B1D18A; --md-on-primary:#1F3701; --md-primary-container:#354E16; --md-on-primary-container:#CDEDA3;
      --md-secondary:#BFCBAD; --md-on-secondary:#2A331E; --md-secondary-container:#404A33; --md-on-secondary-container:#DCE7C8;
      --md-tertiary:#A0D0CB; --md-on-tertiary:#003734; --md-tertiary-container:#1F4E4B; --md-on-tertiary-container:#BCECE7;
      --md-error:#FFB4AB; --md-error-container:#93000A; --md-on-error-container:#FFDAD6;
      --md-surface:#12140E; --md-on-surface:#E2E3D8; --md-surface-variant:#44483D; --md-on-surface-variant:#C5C8BA;
      --md-outline:#8F9285; --md-outline-variant:#44483D;
      --md-s-lowest:#0C0F09; --md-s-low:#1A1C16; --md-s:#1E201A; --md-s-high:#282B24; --md-s-highest:#33362E;
      --md-inverse-surface:#E2E3D8; --md-inverse-on-surface:#2F312A;
      --a:#E0A244; --a-soft:rgba(224,162,68,.16);
      --b:#35B3A2; --b-soft:rgba(53,179,162,.16);
      --steep:#FFB4AB;
      --shadow-1:0 1px 2px rgba(0,0,0,.4), 0 1px 3px 1px rgba(0,0,0,.25);
      --shadow-2:0 1px 3px rgba(0,0,0,.45), 0 4px 8px 3px rgba(0,0,0,.30);
    }
  }
  :root[data-theme="light"] {
    --md-primary:#4C662B; --md-on-primary:#FFFFFF; --md-primary-container:#CDEDA3; --md-on-primary-container:#0F2000;
    --md-secondary:#586249; --md-on-secondary:#FFFFFF; --md-secondary-container:#DCE7C8; --md-on-secondary-container:#151E0B;
    --md-tertiary:#386663; --md-on-tertiary:#FFFFFF; --md-tertiary-container:#BCECE7; --md-on-tertiary-container:#00201E;
    --md-error:#BA1A1A; --md-error-container:#FFDAD6; --md-on-error-container:#410002;
    --md-surface:#F9FAEF; --md-on-surface:#1A1C16; --md-surface-variant:#E1E4D5; --md-on-surface-variant:#44483D;
    --md-outline:#75796C; --md-outline-variant:#C5C8BA;
    --md-s-lowest:#FFFFFF; --md-s-low:#F3F4E9; --md-s:#EDEEE3; --md-s-high:#E7E9DD; --md-s-highest:#E1E3D7;
    --md-inverse-surface:#2F312A; --md-inverse-on-surface:#F1F2E6;
    --a:#C47F22; --a-soft:rgba(196,127,34,.14); --b:#1F8F81; --b-soft:rgba(31,143,129,.14); --steep:#BA1A1A;
    --shadow-1:0 1px 2px rgba(0,0,0,.10), 0 1px 3px 1px rgba(0,0,0,.06);
    --shadow-2:0 1px 2px rgba(0,0,0,.12), 0 2px 6px 2px rgba(0,0,0,.08);
  }
  :root[data-theme="dark"] {
    --md-primary:#B1D18A; --md-on-primary:#1F3701; --md-primary-container:#354E16; --md-on-primary-container:#CDEDA3;
    --md-secondary:#BFCBAD; --md-on-secondary:#2A331E; --md-secondary-container:#404A33; --md-on-secondary-container:#DCE7C8;
    --md-tertiary:#A0D0CB; --md-on-tertiary:#003734; --md-tertiary-container:#1F4E4B; --md-on-tertiary-container:#BCECE7;
    --md-error:#FFB4AB; --md-error-container:#93000A; --md-on-error-container:#FFDAD6;
    --md-surface:#12140E; --md-on-surface:#E2E3D8; --md-surface-variant:#44483D; --md-on-surface-variant:#C5C8BA;
    --md-outline:#8F9285; --md-outline-variant:#44483D;
    --md-s-lowest:#0C0F09; --md-s-low:#1A1C16; --md-s:#1E201A; --md-s-high:#282B24; --md-s-highest:#33362E;
    --md-inverse-surface:#E2E3D8; --md-inverse-on-surface:#2F312A;
    --a:#E0A244; --a-soft:rgba(224,162,68,.16); --b:#35B3A2; --b-soft:rgba(53,179,162,.16); --steep:#FFB4AB;
    --shadow-1:0 1px 2px rgba(0,0,0,.4), 0 1px 3px 1px rgba(0,0,0,.25);
    --shadow-2:0 1px 3px rgba(0,0,0,.45), 0 4px 8px 3px rgba(0,0,0,.30);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--md-surface);
    color: var(--md-on-surface);
    font-family: 'Roboto', system-ui, -apple-system, "Segoe UI", sans-serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    font-feature-settings: "kern" 1;
  }
  .num { font-variant-numeric: tabular-nums; }

  /* MD3 type scale */
  .t-eyebrow { font-size: 11px; font-weight: 500; letter-spacing: .1em; text-transform: uppercase; color: var(--md-on-surface-variant); }
  .t-title-l { font-size: 22px; font-weight: 500; letter-spacing: 0; }
  .t-headline { font-size: clamp(24px, 3.6vw, 32px); font-weight: 400; letter-spacing: -0.01em; text-wrap: balance; }
  .t-title-m { font-size: 16px; font-weight: 500; }
  .t-label { font-size: 11px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--md-on-surface-variant); }
  .t-body { font-size: 14px; font-weight: 400; }

  /* ---------------- top app bar ---------------- */
  .app-bar {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
    padding: 10px clamp(14px, 3vw, 28px);
    background: var(--md-surface);
    border-bottom: 1px solid var(--md-outline-variant);
  }
  .app-bar .brand { display: flex; align-items: center; gap: 12px; }
  .app-bar .brand .mark {
    width: 34px; height: 34px; border-radius: var(--r-s); flex: none;
    background: var(--md-primary-container); color: var(--md-on-primary-container);
    display: grid; place-items: center;
  }
  .app-bar .brand h1 { margin: 0; color: var(--md-on-surface); }
  .app-bar .actions { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }

  /* MD3 segmented button */
  .segmented { display: inline-flex; border: 1px solid var(--md-outline); border-radius: var(--r-full); overflow: hidden; height: 40px; }
  .segmented .seg {
    position: relative; display: inline-flex; align-items: center; gap: 6px;
    border: none; background: transparent; color: var(--md-on-surface-variant);
    font-family: inherit; font-size: 14px; font-weight: 500; letter-spacing: .01em;
    padding: 0 16px; cursor: pointer; white-space: nowrap;
  }
  .segmented .seg + .seg { border-left: 1px solid var(--md-outline); }
  .segmented .seg::before { content: ""; position: absolute; inset: 0; background: currentColor; opacity: 0; transition: opacity .12s; }
  .segmented .seg:hover::before { opacity: .08; }
  .segmented .seg:focus-visible { outline: 2px solid var(--md-primary); outline-offset: -2px; }
  .segmented .seg[aria-pressed="true"] { background: var(--md-secondary-container); color: var(--md-on-secondary-container); }
  .segmented .seg .check { width: 18px; height: 18px; display: none; }
  .segmented .seg[aria-pressed="true"] .check { display: inline-block; }

  /* language flags */
  .lang { display: inline-flex; gap: 4px; }
  .flag-btn {
    position: relative; width: 40px; height: 40px; border-radius: var(--r-full);
    border: none; background: transparent; cursor: pointer; padding: 0;
    display: grid; place-items: center;
  }
  .flag-btn::before { content: ""; position: absolute; inset: 0; border-radius: inherit; background: var(--md-on-surface); opacity: 0; transition: opacity .12s; }
  .flag-btn:hover::before { opacity: .08; }
  .flag-btn:focus-visible { outline: 2px solid var(--md-primary); outline-offset: 2px; }
  .flag-btn svg { width: 26px; height: auto; border-radius: 3px; display: block; box-shadow: 0 0 0 1px rgba(0,0,0,.12); transition: opacity .12s, transform .12s; }
  .flag-btn[aria-pressed="false"] svg { opacity: .38; filter: saturate(.6); }
  .flag-btn[aria-pressed="true"] { background: var(--md-secondary-container); }
  .flag-btn[aria-pressed="true"] svg { transform: scale(1.02); }

  /* ---------------- layout ---------------- */
  .wrap { max-width: 1040px; margin: 0 auto; padding: clamp(16px, 3vw, 32px); display: flex; flex-direction: column; gap: 20px; }
  .hero { display: flex; flex-direction: column; gap: 8px; }
  .hero .lede { margin: 0; color: var(--md-on-surface-variant); max-width: 64ch; font-size: 15px; }
  .hero .lede b { color: var(--md-on-surface); font-weight: 500; }

  /* MD3 cards (filled) */
  .card { background: var(--md-s-low); border: 1px solid var(--md-outline-variant); border-radius: var(--r-l); overflow: hidden; }
  .card > .hd { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 16px 20px 12px; }
  .card > .hd h2 { margin: 0; color: var(--md-on-surface); }
  .card > .hd .hint { color: var(--md-on-surface-variant); font-size: 12px; }
  .card > .bd { padding: 8px 20px 20px; }

  /* file drops */
  .drops { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 640px) { .drops { grid-template-columns: 1fr; } }
  .drop {
    border: 1.5px dashed var(--md-outline); border-radius: var(--r-m);
    background: var(--md-s); padding: 16px; cursor: pointer;
    display: flex; flex-direction: column; gap: 6px; min-height: 96px; justify-content: center;
    transition: border-color .15s, background .15s;
  }
  .drop:focus-visible { outline: 2px solid var(--md-primary); outline-offset: 2px; }
  .drop.a { border-left: 4px solid var(--a); }
  .drop.b { border-left: 4px solid var(--b); }
  .drop.over { background: var(--md-s-high); border-color: var(--md-primary); }
  .drop .tag { font-size: 11px; font-weight: 500; letter-spacing: .1em; text-transform: uppercase; }
  .drop.a .tag { color: var(--a); } .drop.b .tag { color: var(--b); }
  .drop .fname { font-weight: 500; font-size: 15px; word-break: break-word; color: var(--md-on-surface); }
  .drop .sub { font-size: 12px; color: var(--md-on-surface-variant); }

  /* knobs */
  .controls { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; }
  @media (max-width: 680px) { .controls { grid-template-columns: 1fr; } }
  .knob { display: flex; flex-direction: column; gap: 8px; }
  .knob .k-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .knob label { font-size: 14px; font-weight: 500; color: var(--md-on-surface); }
  .knob .k-val { font-size: 13px; font-weight: 500; color: var(--md-primary); }
  .knob .k-desc { font-size: 12px; color: var(--md-on-surface-variant); line-height: 1.45; }

  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 20px; background: transparent; cursor: pointer; }
  input[type=range]:focus { outline: none; }
  input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: var(--r-full); background: var(--md-secondary-container); }
  input[type=range]::-moz-range-track { height: 4px; border-radius: var(--r-full); background: var(--md-secondary-container); }
  input[type=range]::-moz-range-progress { height: 4px; border-radius: var(--r-full); background: var(--md-primary); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; margin-top: -7px; border-radius: 50%; background: var(--md-primary); border: 3px solid var(--md-s-low); box-shadow: 0 0 0 1px var(--md-primary); }
  input[type=range]::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; background: var(--md-primary); border: 3px solid var(--md-s-low); box-shadow: 0 0 0 1px var(--md-primary); }
  input[type=range]:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 1px var(--md-primary), 0 0 0 6px color-mix(in srgb, var(--md-primary) 20%, transparent); }

  .presets { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
  .chip {
    position: relative; font-family: inherit; font-size: 13px; font-weight: 500;
    background: transparent; color: var(--md-on-surface-variant);
    border: 1px solid var(--md-outline); border-radius: var(--r-s); padding: 7px 12px; cursor: pointer;
  }
  .chip::before { content: ""; position: absolute; inset: 0; border-radius: inherit; background: var(--md-on-surface); opacity: 0; transition: opacity .12s; }
  .chip:hover::before { opacity: .08; }
  .chip:focus-visible { outline: 2px solid var(--md-primary); outline-offset: 2px; }

  /* stats */
  .stats { display: grid; grid-template-columns: 1.3fr 1fr 1fr 1fr; }
  .stats .cell { padding: 12px 14px; border-bottom: 1px solid var(--md-outline-variant); display: flex; align-items: center; font-size: 14px; }
  .stats .cell.measure { color: var(--md-on-surface-variant); }
  .stats .cell.n { justify-content: flex-end; font-weight: 500; }
  .stats .cell.head { font-size: 11px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--md-on-surface-variant); border-bottom: 1px solid var(--md-outline); }
  .stats .cell.head.n { justify-content: flex-end; }
  .stats .cell:nth-last-child(-n+4) { border-bottom: none; }
  .dot { width: 9px; height: 9px; border-radius: 3px; display: inline-block; margin-right: 7px; }
  .dot.a { background: var(--a); } .dot.b { background: var(--b); }
  .delta.up { color: var(--steep); } .delta.down { color: var(--b); }

  /* charts */
  .chart-shell { position: relative; width: 100%; }
  canvas { display: block; width: 100%; }
  .legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px; color: var(--md-on-surface-variant); }
  .legend .item { display: flex; align-items: center; gap: 6px; }
  .legend .line { width: 18px; height: 3px; border-radius: 2px; }
  .legend .line.a { background: var(--a); } .legend .line.b { background: var(--b); } .legend .line.steep { background: var(--steep); }
  .tip {
    position: absolute; pointer-events: none; opacity: 0; transition: opacity .1s;
    background: var(--md-inverse-surface); color: var(--md-inverse-on-surface); border-radius: var(--r-s);
    box-shadow: var(--shadow-2); padding: 8px 10px; font-size: 12px; white-space: nowrap; z-index: 3;
  }
  .tip .tk { opacity: .7; } .tip .ta { color: var(--a); } .tip .tb { color: var(--b); }

  /* climbs */
  .climbs-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 720px) { .climbs-grid { grid-template-columns: 1fr; } }
  .track-lab { font-size: 11px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--md-on-surface-variant); margin-bottom: 8px; display: flex; gap: 7px; align-items: center; }
  .track { position: relative; height: 30px; background: var(--md-s); border: 1px solid var(--md-outline-variant); border-radius: var(--r-s); overflow: hidden; }
  .track .band { position: absolute; top: 0; bottom: 0; }
  .clist { list-style: none; margin: 12px 0 0; padding: 0; display: flex; flex-direction: column; }
  .clist li { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: baseline; padding: 7px 0; border-bottom: 1px solid var(--md-outline-variant); font-size: 13px; }
  .clist li:last-child { border-bottom: none; }
  .clist .pos { color: var(--md-on-surface-variant); }
  .clist .gain { font-weight: 500; }
  .grad-pill { font-size: 11px; font-weight: 500; padding: 1px 7px; border-radius: var(--r-xs); color: #fff; margin-left: 6px; }

  .empty { color: var(--md-on-surface-variant); font-size: 14px; text-align: center; padding: 20px; }

  footer.notes { color: var(--md-on-surface-variant); font-size: 13px; max-width: 76ch; line-height: 1.55; }
  footer.notes strong { color: var(--md-on-surface); font-weight: 500; }
  footer.notes ul { margin: 8px 0 0; padding-left: 18px; display: flex; flex-direction: column; gap: 5px; }
  a { color: var(--md-primary); }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<header class="app-bar">
  <div class="brand">
    <span class="mark" aria-hidden="true">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-8 4 5 3-4 6 7"/></svg>
    </span>
    <h1 class="t-title-l" data-i18n="appTitle">Ascent Comparator</h1>
  </div>
  <div class="actions">
    <div class="segmented" role="group" id="unitGroup" aria-label="units">
      <button class="seg" data-unit="metric" aria-pressed="true">
        <svg class="check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
        <span data-i18n="unitMetric">Metric</span>
      </button>
      <button class="seg" data-unit="imperial" aria-pressed="false">
        <svg class="check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
        <span data-i18n="unitImperial">Imperial</span>

<div class="wrap">

<script>
"use strict";
(function () {
  // ---------------- i18n ----------------
  const I18N = {
    en: {
      appTitle: "Ascent Comparator",
      eyebrow: "GPX · elevation gain forensics",
      lede: "Total ascent isn’t a property of a route — it’s a property of the elevation <b>source</b>, the <b>sampling density</b>, and the <b>smoothing</b> applied before summing. Drop two GPX files and re-derive both with the <b>same</b> algorithm, then move the knobs to see how much the number really moves.",
      unitMetric: "Metric", unitImperial: "Imperial",
      tracksTitle: "Tracks", tracksHint: "drag & drop or click · nothing leaves your browser",
      routeA: "Route A", routeB: "Route B",
      dropPrompt: "Drop a .gpx file…", pts: "pts", readErr: "Couldn’t read the file",
      knobsTitle: "Algorithm knobs", knobsHint: "applied identically to both tracks",
      resampleLabel: "Resample spacing",
      resampleDesc: "Re-space both tracks evenly before summing, so point-density differences stop inflating the gain. 0 = use the raw points.",
      smoothLabel: "Smoothing window",
      smoothDesc: "Moving-average the elevation profile over this distance to kill sensor / DEM jitter. Wider = lower gain.",
      threshLabel: "Threshold (deadband)",
      threshDesc: "Only count a rise once it exceeds this. This single number is where most tools quietly disagree.",
      presetRaw: "Raw (no cleanup)", presetBalanced: "Balanced", presetGarmin: "Garmin-ish (hot)", presetMapy: "Mapy-ish (smooth)",
      compTitle: "Comparison",
      hintNone: "load two tracks", hintOne: "load the second track to compare", hintBoth: "same algorithm, both tracks",
      emptyNone: "No tracks loaded yet.",
      measure: "Measure", colA: "A", colB: "B", colDelta: "Δ B−A",
      mDistance: "Distance", mAscent: "Ascent", mDescent: "Descent", mAscentPer: "Ascent",
      mAltRange: "Altitude range", mClimbs: "Named climbs",
      profTitle: "Elevation profile", legRamp: "≥8% ramp", loadTrack: "load a track",
      sensTitle: "Gain vs. threshold", sensHint: "how far the “total ascent” claim depends on one knob",
      sensX: "deadband threshold →",
      climbsTitle: "Where the climbing lives", climbsHint: "climbs ≥20 m, placed at their real distance",
      unnamed: "unnamed", noClimbs: "no climbs above the cut-off", avg: "avg",
      footTitle: "Reading the numbers honestly.",
      foot1: "Elevation in exported GPX is often quantised to whole metres and draped over a smooth DEM, so raw gain under-counts; a densely-recorded device track with a small deadband over-counts. Same hill, different arithmetic.",
      foot2: "GPX carries no surface, traffic or road-class data — “harder” here means physical effort only.",
      foot3: "To compare routes rather than sources, re-drape both over one common DEM (a future toggle); for now, resample and smooth both identically and read a range, not a single figure."
    },
    cs: {
      appTitle: "Porovnání převýšení",
      eyebrow: "GPX · rozbor převýšení",
      lede: "Celkové převýšení není vlastností trasy — je vlastností <b>zdroje</b> výškových dat, <b>hustoty bodů</b> a <b>vyhlazení</b> použitého před součtem. Přetáhněte dva soubory GPX a spočítejte oba <b>stejným</b> postupem; pak posuňte parametry a uvidíte, jak moc se číslo ve skutečnosti mění.",
      unitMetric: "Metrické", unitImperial: "Imperiální",
      tracksTitle: "Trasy", tracksHint: "přetáhněte nebo klikněte · nic neopustí váš prohlížeč",
      routeA: "Trasa A", routeB: "Trasa B",
      dropPrompt: "Přetáhněte soubor .gpx…", pts: "bodů", readErr: "Soubor se nepodařilo načíst",
      knobsTitle: "Parametry výpočtu", knobsHint: "použity shodně na obě trasy",
      resampleLabel: "Krok převzorkování",
      resampleDesc: "Rozmístí body obou tras rovnoměrně před součtem, aby rozdílná hustota bodů uměle nenavyšovala převýšení. 0 = použít původní body.",
      smoothLabel: "Okno vyhlazení",
      smoothDesc: "Klouzavý průměr výškového profilu na této vzdálenosti potlačí šum senzoru / DEM. Širší okno = nižší převýšení.",
      threshLabel: "Práh (necitlivost)",
      threshDesc: "Stoupání se započítá, až když překročí tuto hodnotu. Právě v tomto jediném čísle se nástroje nejčastěji potají rozcházejí.",
      presetRaw: "Surová data (bez úprav)", presetBalanced: "Vyvážené", presetGarmin: "Ve stylu Garminu (vyšší)", presetMapy: "Ve stylu Mapy.cz (vyhlazené)",
      compTitle: "Porovnání",
      hintNone: "načtěte dvě trasy", hintOne: "načtěte druhou trasu k porovnání", hintBoth: "stejný výpočet pro obě trasy",
      emptyNone: "Zatím nejsou načteny žádné trasy.",
      measure: "Veličina", colA: "A", colB: "B", colDelta: "Δ B−A",
      mDistance: "Vzdálenost", mAscent: "Stoupání", mDescent: "Klesání", mAscentPer: "Stoupání",
      mAltRange: "Rozsah nadm. výšky", mClimbs: "Významná stoupání",
      profTitle: "Výškový profil", legRamp: "úsek ≥8 %", loadTrack: "načtěte trasu",
      sensTitle: "Převýšení vs. práh", sensHint: "jak moc údaj o „celkovém převýšení“ závisí na jediném parametru",
      sensX: "práh necitlivosti →",
      climbsTitle: "Kde se stoupá", climbsHint: "stoupání ≥20 m, umístěná dle skutečné vzdálenosti",
      unnamed: "bez názvu", noClimbs: "žádná stoupání nad prahovou hodnotou", avg: "prům.",
      footTitle: "Jak čísla číst poctivě.",
      foot1: "Výška v exportovaném GPX bývá zaokrouhlena na celé metry a odečtena z hladkého DEM, takže surové převýšení bývá podhodnocené; hustě zaznamenaná stopa z přístroje s malou necitlivostí je naopak nadhodnocená. Stejný kopec, jiná matematika.",
      foot2: "GPX neobsahuje data o povrchu, provozu ani třídě silnice — „náročnější“ zde znamená pouze fyzickou námahu.",
      foot3: "Chcete-li porovnat trasy, a ne zdroje, odečtěte výšku obou ze stejného DEM (budoucí volba); zatím obě převzorkujte a vyhlaďte shodně a čtěte rozsah, nikoli jediné číslo."
    }
  };

  let lang = localStorage.getItem("gpx.lang") || (navigator.language || "en").slice(0, 2).toLowerCase();
  if (!I18N[lang]) lang = "en";
  let unit = localStorage.getItem("gpx.unit") || "metric";

  const t = k => (I18N[lang] && I18N[lang][k] !== undefined) ? I18N[lang][k] : (I18N.en[k] ?? k);
  const loc = () => lang === "cs" ? "cs-CZ" : "en-GB";
  const nf = (n, d = 0) => n.toLocaleString(loc(), { minimumFractionDigits: d, maximumFractionDigits: d });

  // unit conversion (data is stored in metric; converted only for display)
  const KM2MI = 0.621371, M2FT = 3.28084;
  const uDist = km => unit === "imperial" ? km * KM2MI : km;
  const uEle = m => unit === "imperial" ? m * M2FT : m;
  const distU = () => unit === "imperial" ? "mi" : "km";
  const eleU = () => unit === "imperial" ? "ft" : "m";

  // ---------------- geo / parsing ----------------
  const R = 6371000;
  function haversine(la1, lo1, la2, lo2) {
    const p1 = la1 * Math.PI / 180, p2 = la2 * Math.PI / 180;
    const dp = (la2 - la1) * Math.PI / 180, dl = (lo2 - lo1) * Math.PI / 180;
    const a = Math.sin(dp / 2) ** 2 + Math.cos(p1) * Math.cos(p2) * Math.sin(dl / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(a));
  }
  function parseGPX(text) {
    const doc = new DOMParser().parseFromString(text, "application/xml");
    if (doc.getElementsByTagName("parsererror").length) throw new Error("bad xml");
    let nodes = doc.getElementsByTagName("trkpt");
    if (!nodes.length) nodes = doc.getElementsByTagName("rtept");
    if (!nodes.length) throw new Error("no points");
    const nameEl = doc.getElementsByTagName("name")[0];
    const name = nameEl ? nameEl.textContent.trim() : "";
    const pts = [];
    for (const n of nodes) {
      const lat = parseFloat(n.getAttribute("lat")), lon = parseFloat(n.getAttribute("lon"));
      const eleEl = n.getElementsByTagName("ele")[0];
      const ele = eleEl ? parseFloat(eleEl.textContent) : NaN;
      if (Number.isFinite(lat) && Number.isFinite(lon)) pts.push({ lat, lon, ele });
    }
    let last = NaN;
    for (const p of pts) { if (!Number.isFinite(p.ele)) p.ele = last; else last = p.ele; }
    for (let i = pts.length - 1; i >= 0; i--) { if (!Number.isFinite(pts[i].ele)) pts[i].ele = pts[i + 1] ? pts[i + 1].ele : 0; else break; }
    return { name, pts };
  }
  const cumulative = pts => { const d = [0]; for (let i = 1; i < pts.length; i++) d.push(d[i - 1] + haversine(pts[i - 1].lat, pts[i - 1].lon, pts[i].lat, pts[i].lon)); return d; };

  function resampleSeries(dist, ele, spacing) {
    if (!spacing || spacing <= 0) return { d: dist.slice(), e: ele.slice() };
    const total = dist[dist.length - 1], outD = [], outE = []; let j = 0;
    for (let x = 0; x <= total; x += spacing) {
      while (j < dist.length - 2 && dist[j + 1] < x) j++;
      const d0 = dist[j], d1 = dist[j + 1] ?? d0, e0 = ele[j], e1 = ele[j + 1] ?? ele[j];
      const tt = d1 > d0 ? (x - d0) / (d1 - d0) : 0;
      outD.push(x); outE.push(e0 + (e1 - e0) * tt);
    }
    return { d: outD, e: outE };
  }
  function movingAvg(e, win) {
    if (win <= 1) return e.slice();
    const half = win >> 1, n = e.length, ps = new Array(n + 1); ps[0] = 0;
    for (let i = 0; i < n; i++) ps[i + 1] = ps[i] + e[i];
    const out = new Array(n);
    for (let i = 0; i < n; i++) { const lo = Math.max(0, i - half), hi = Math.min(n, i + half + 1); out[i] = (ps[hi] - ps[lo]) / (hi - lo); }
    return out;
  }
  function gainLoss(e, th) {
    let g = 0, l = 0, ref = e[0];
    for (let i = 1; i < e.length; i++) { const de = e[i] - ref; if (de >= th) { g += de; ref = e[i]; } else if (de <= -th) { l += -de; ref = e[i]; } }
    return { gain: g, loss: l };
  }
  function findClimbs(dKm, e) {
    const seg = 250, segs = []; let s = 0;
    for (let i = 1; i < dKm.length; i++) {
      if ((dKm[i] - dKm[s]) * 1000 >= seg) { const dd = (dKm[i] - dKm[s]) * 1000, de = e[i] - e[s]; segs.push({ s: dKm[s], e: dKm[i], grad: (de / dd) * 100, gain: de }); s = i; }
    }
    const climbs = []; let cur = null;
    for (const sg of segs) {
      if (sg.grad >= 3) { if (!cur) cur = { start: sg.s, end: sg.e, gain: Math.max(0, sg.gain), maxg: sg.grad }; else { cur.end = sg.e; cur.gain += Math.max(0, sg.gain); cur.maxg = Math.max(cur.maxg, sg.grad); } }
      else if (cur) { climbs.push(cur); cur = null; }
    }
    if (cur) climbs.push(cur);
    return climbs.filter(c => c.gain >= 20).map(c => { const len = c.end - c.start; return { ...c, len, avg: len > 0 ? (c.gain / (len * 1000)) * 100 : 0 }; });
  }
  const opts = { resample: 10, smooth: 30, thresh: 2 };
  function process(track) {
    const dist = cumulative(track.pts), eleRaw = track.pts.map(p => p.ele);
    const { d, e } = resampleSeries(dist, eleRaw, opts.resample);
    const spacing = opts.resample > 0 ? opts.resample : (d.length > 1 ? d[d.length - 1] / (d.length - 1) : 1);
    const win = opts.smooth > 0 ? Math.max(1, Math.round(opts.smooth / spacing)) : 1;
    const es = movingAvg(e, win);
    const { gain, loss } = gainLoss(es, opts.thresh);
    const dKm = d.map(x => x / 1000);
    return { name: track.name, dKm, es, distKm: d[d.length - 1] / 1000, gain, loss, eMin: Math.min(...es), eMax: Math.max(...es), climbs: findClimbs(dKm, es).sort((a, b) => b.gain - a.gain) };
  }

  // ---------------- state ----------------
  const state = { A: null, B: null, rawA: null, rawB: null, metaA: null, metaB: null };
  const $ = id => document.getElementById(id);

  // ---------------- static i18n ----------------
  function applyStatic() {
    document.documentElement.lang = lang;
    document.querySelectorAll("[data-i18n]").forEach(el => {
      const key = el.getAttribute("data-i18n");
      const val = t(key);
      if (/[<&]/.test(val)) el.innerHTML = val; else el.textContent = val;
    });
    renderDropLabels();
    updateKnobLabels();
    updateStatHint();
  }
  function renderDropLabels() {
    for (const slot of ["A", "B"]) {
      const m = state["meta" + slot];
      $("name" + slot).textContent = m ? m.title : t("dropPrompt");
      $("sub" + slot).textContent = m ? (m.file + " · " + m.pts + " " + t("pts")) : "—";
    }
  }
  function updateKnobLabels() {
    $("resampleV").textContent = knobText(opts.resample, 0);
    $("smoothV").textContent = knobText(opts.smooth, 0);
    $("threshV").textContent = knobText(opts.thresh, 1);
  }
  function knobText(meters, metricDec) {
    if (meters === 0) return "0 " + eleU();
    const v = uEle(meters);
    const dec = unit === "imperial" ? (v < 20 ? 1 : 0) : metricDec;
    return nf(v, dec) + " " + eleU();
  }
  function updateStatHint() {
    $("statHint").textContent = state.A && state.B ? t("hintBoth") : (state.A || state.B) ? t("hintOne") : t("hintNone");
  }

  // ---------------- stats ----------------
  function renderStats() {
    const box = $("stats"), A = state.A, B = state.B;
    if (!A && !B) { box.innerHTML = `<div class="empty">${t("emptyNone")}</div>`; return; }
    const perU = t("mAscentPer") + " / " + distU();
    const rows = [
      { label: t("mDistance"), get: a => uDist(a.distKm), fmt: v => nf(v, 1) + " " + distU(), delta: true, dd: 1 },
      { label: t("mAscent"), get: a => uEle(a.gain), fmt: v => nf(v) + " " + eleU(), delta: true, dd: 0 },
      { label: t("mDescent"), get: a => uEle(a.loss), fmt: v => nf(v) + " " + eleU(), delta: false },
      { label: perU, get: a => uEle(a.gain) / uDist(a.distKm), fmt: v => nf(v) + " " + eleU(), delta: true, dd: 0 },
      { label: t("mAltRange"), raw: a => nf(Math.round(uEle(a.eMin))) + "–" + nf(Math.round(uEle(a.eMax))) + " " + eleU(), delta: false },
      { label: t("mClimbs") + " (≥" + knobText(20, 0) + ")", get: a => a.climbs.length, fmt: v => nf(v), delta: false }
    ];
    let h = `<div class="cell head measure">${t("measure")}</div>`;
    h += `<div class="cell head n"><span class="dot a"></span>${t("colA")}</div>`;
    h += `<div class="cell head n"><span class="dot b"></span>${t("colB")}</div>`;
    h += `<div class="cell head n">${t("colDelta")}</div>`;
    for (const r of rows) {
      const cellVal = a => a ? (r.raw ? r.raw(a) : r.fmt(r.get(a))) : "—";
      h += `<div class="cell measure">${r.label}</div>`;
      h += `<div class="cell n num">${cellVal(A)}</div>`;
      h += `<div class="cell n num">${cellVal(B)}</div>`;
      if (A && B && r.delta) {
        const dv = r.get(B) - r.get(A), cls = dv > 0 ? "up" : dv < 0 ? "down" : "", sign = dv > 0 ? "+" : "";
        h += `<div class="cell n num"><span class="delta ${cls}">${sign}${nf(dv, r.dd || 0)}</span></div>`;
      } else h += `<div class="cell n num">—</div>`;
    }
    box.innerHTML = h;
  }

  // ---------------- chart helpers ----------------
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  function niceStep(raw) { const p = Math.pow(10, Math.floor(Math.log10(raw))); const n = raw / p; return (n < 1.5 ? 1 : n < 3 ? 2 : n < 7 ? 5 : 10) * p; }
  function setupCanvas(cv, hh) { const dpr = window.devicePixelRatio || 1, w = cv.clientWidth; if (w <= 0) return null; cv.width = w * dpr; cv.height = hh * dpr; const ctx = cv.getContext("2d"); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, w, hh); return { ctx, w, h: hh }; }
  function softMsg(ctx, w, h, msg) { ctx.fillStyle = css("--md-on-surface-variant"); ctx.font = "14px Roboto, sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(msg, w / 2, h / 2); }

  let profGeo = null;
  function drawProfile() {
    const cv = $("profile"), setup = setupCanvas(cv, 320);
    if (!setup) return;
    const { ctx, w, h } = setup;
    const tracks = [state.A, state.B].filter(Boolean);
    if (!tracks.length) { profGeo = null; softMsg(ctx, w, h, t("loadTrack")); return; }
    const pad = { l: 52, r: 14, t: 14, b: 26 }, W = w - pad.l - pad.r, H = h - pad.t - pad.b;
    const maxD = Math.max(...tracks.map(x => x.distKm));
    let eMin = Math.min(...tracks.map(x => x.eMin)), eMax = Math.max(...tracks.map(x => x.eMax));
    const ep = Math.max(10, (eMax - eMin) * 0.08); eMin -= ep; eMax += ep;
    const X = km => pad.l + (km / maxD) * W, Y = m => pad.t + H - ((m - eMin) / (eMax - eMin)) * H;

    ctx.font = "11px Roboto, sans-serif"; ctx.textBaseline = "middle";
    ctx.strokeStyle = css("--md-outline-variant"); ctx.fillStyle = css("--md-on-surface-variant"); ctx.lineWidth = 1;
    const eMinD = uEle(eMin), eMaxD = uEle(eMax), stepD = niceStep((eMaxD - eMinD) / 5);
    for (let md = Math.ceil(eMinD / stepD) * stepD; md < eMaxD; md += stepD) {
      const m = unit === "imperial" ? md / M2FT : md, y = Y(m);
      ctx.globalAlpha = .55; ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(w - pad.r, y); ctx.stroke(); ctx.globalAlpha = 1;
      ctx.textAlign = "right"; ctx.fillText(nf(md), pad.l - 6, y);
    }
    ctx.textAlign = "center"; ctx.textBaseline = "top";
    const maxDd = uDist(maxD), stepDd = niceStep(maxDd / 8);
    for (let kd = 0; kd <= maxDd + 1e-6; kd += stepDd) { const km = unit === "imperial" ? kd / KM2MI : kd; ctx.fillText(nf(kd), X(km), h - pad.b + 6); }

    const cA = css("--a"), cB = css("--b"), sA = css("--a-soft"), sB = css("--b-soft"), st = css("--steep");
    for (const [key, tr] of [["A", state.A], ["B", state.B]]) {
      if (!tr) continue;
      ctx.beginPath(); ctx.moveTo(X(0), Y(tr.es[0]));
      for (let i = 1; i < tr.dKm.length; i++) ctx.lineTo(X(tr.dKm[i]), Y(tr.es[i]));
      ctx.lineTo(X(tr.dKm[tr.dKm.length - 1]), Y(eMin)); ctx.lineTo(X(0), Y(eMin)); ctx.closePath();
      ctx.fillStyle = key === "A" ? sA : sB; ctx.fill();
      ctx.lineJoin = "round"; ctx.lineWidth = 1.8; ctx.strokeStyle = key === "A" ? cA : cB;
      ctx.beginPath(); ctx.moveTo(X(0), Y(tr.es[0]));
      for (let i = 1; i < tr.dKm.length; i++) ctx.lineTo(X(tr.dKm[i]), Y(tr.es[i]));
      ctx.stroke();
      ctx.strokeStyle = st; ctx.lineWidth = 3.2;
      for (let i = 1; i < tr.dKm.length; i++) {
        const dd = (tr.dKm[i] - tr.dKm[i - 1]) * 1000; if (dd <= 0) continue;
        if (((tr.es[i] - tr.es[i - 1]) / dd) * 100 >= 8) { ctx.beginPath(); ctx.moveTo(X(tr.dKm[i - 1]), Y(tr.es[i - 1])); ctx.lineTo(X(tr.dKm[i]), Y(tr.es[i])); ctx.stroke(); }
      }
    }
    profGeo = { pad, W, H, maxD, eMin, eMax, X, Y, w, h };
  }

  function interp(xs, ys, x) {
    if (x <= xs[0]) return ys[0]; const hiI = xs.length - 1; if (x >= xs[hiI]) return ys[hiI];
    let lo = 0, hi = hiI; while (hi - lo > 1) { const m = (lo + hi) >> 1; if (xs[m] < x) lo = m; else hi = m; }
    const tt = (x - xs[lo]) / (xs[hi] - xs[lo] || 1); return ys[lo] + (ys[hi] - ys[lo]) * tt;
  }
  const tip = $("tip");
  $("profile").addEventListener("mousemove", ev => {
    if (!profGeo) return;
    const g = profGeo, rect = ev.currentTarget.getBoundingClientRect(), px = ev.clientX - rect.left;
    if (px < g.pad.l || px > g.w - g.pad.r) { tip.style.opacity = 0; drawProfile(); return; }
    const km = ((px - g.pad.l) / g.W) * g.maxD; drawProfile();
    const ctx = ev.currentTarget.getContext("2d");
    ctx.strokeStyle = css("--md-outline"); ctx.globalAlpha = .6; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(px, g.pad.t); ctx.lineTo(px, g.pad.t + g.H); ctx.stroke(); ctx.globalAlpha = 1;
    let lines = [`<span class="tk">${nf(uDist(km), 1)} ${distU()}</span>`];
    for (const [key, tr] of [["A", state.A], ["B", state.B]]) {
      if (!tr || km > tr.distKm) continue;
      const e = interp(tr.dKm, tr.es, km);
      ctx.fillStyle = css(key === "A" ? "--a" : "--b"); ctx.beginPath(); ctx.arc(g.X(km), g.Y(e), 3.2, 0, 7); ctx.fill();
      lines.push(`<span class="t${key.toLowerCase()}">${key} ${nf(Math.round(uEle(e)))} ${eleU()}</span>`);
    }
    tip.innerHTML = lines.join("&nbsp;&nbsp;"); tip.style.opacity = 1;
    let tx = px + 12; if (tx > g.w - 140) tx = px - 140; tip.style.left = tx + "px"; tip.style.top = (g.pad.t + 6) + "px";
  });
  $("profile").addEventListener("mouseleave", () => { tip.style.opacity = 0; drawProfile(); });

  function drawSens() {
    const cv = $("sens"), setup = setupCanvas(cv, 240);
    if (!setup) return;
    const { ctx, w, h } = setup;
    const tracks = [["A", state.A], ["B", state.B]].filter(x => x[1]);
    if (!tracks.length) { softMsg(ctx, w, h, t("loadTrack")); return; }
    const ths = []; for (let x = 0; x <= 10; x += 0.5) ths.push(x);
    const series = tracks.map(([k, tr]) => ({ k, vals: ths.map(x => uEle(gainLoss(tr.es, x).gain)) }));
    const maxG = Math.max(...series.flatMap(s => s.vals), 1);
    const pad = { l: 56, r: 14, t: 14, b: 34 }, W = w - pad.l - pad.r, H = h - pad.t - pad.b;
    const X = th => pad.l + (th / 10) * W, Y = g => pad.t + H - (g / maxG) * H;
    ctx.font = "11px Roboto, sans-serif"; ctx.strokeStyle = css("--md-outline-variant"); ctx.fillStyle = css("--md-on-surface-variant");
    const gStep = niceStep(maxG / 4); ctx.textAlign = "right"; ctx.textBaseline = "middle";
    for (let g = 0; g <= maxG; g += gStep) { const y = Y(g); ctx.globalAlpha = .55; ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(w - pad.r, y); ctx.stroke(); ctx.globalAlpha = 1; ctx.fillText(nf(g), pad.l - 6, y); }
    ctx.textAlign = "center"; ctx.textBaseline = "top";
    for (let x = 0; x <= 10; x += 2) ctx.fillText(nf(uEle(x)) + " " + eleU(), X(x), h - pad.b + 6);
    ctx.fillText(t("sensX"), w / 2, h - 12);
    for (const s of series) { ctx.strokeStyle = css(s.k === "A" ? "--a" : "--b"); ctx.lineWidth = 2; ctx.beginPath(); s.vals.forEach((g, i) => { const x = X(ths[i]), y = Y(g); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }); ctx.stroke(); }
    ctx.strokeStyle = css("--md-outline"); ctx.globalAlpha = .6; ctx.setLineDash([4, 4]); ctx.beginPath(); ctx.moveTo(X(opts.thresh), pad.t); ctx.lineTo(X(opts.thresh), pad.t + H); ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha = 1;
  }

  function gradColor(g) { const stops = [[3, "#8a9a3f"], [4, "#c8a12e"], [5, "#d98a2b"], [6, "#d9662b"], [7, "#cf4b2f"], [8, "#c0303f"]]; let c = stops[0][1]; for (const [g0, col] of stops) if (g >= g0) c = col; return c; }
  function renderClimbs() {
    const box = $("climbs"), tracks = [["A", state.A], ["B", state.B]].filter(x => x[1]);
    if (!tracks.length) { box.innerHTML = `<div class="empty">—</div>`; return; }
    box.innerHTML = tracks.map(([k, tr]) => {
      const maxD = tr.distKm;
      const bands = tr.climbs.map(c => `<div class="band" title="${nf(uDist(c.start), 1)}–${nf(uDist(c.end), 1)} ${distU()} · +${nf(Math.round(uEle(c.gain)))} ${eleU()} · ${c.avg.toFixed(1)}%" style="left:${(c.start / maxD) * 100}%;width:${Math.max(.6, ((c.end - c.start) / maxD) * 100)}%;background:${gradColor(c.avg)}"></div>`).join("");
      const byPos = tr.climbs.slice().sort((a, b) => a.start - b.start);
      const list = byPos.map(c => `<li><span class="pos num">${nf(uDist(c.start), 1)} ${distU()}</span><span class="num">${nf(Math.round(uEle(c.len * 1000)))} ${eleU()} · ${t("avg")} ${c.avg.toFixed(1)}%</span><span class="gain num">+${nf(Math.round(uEle(c.gain)))} ${eleU()}<span class="grad-pill" style="background:${gradColor(c.maxg)}">${c.maxg.toFixed(0)}%</span></span></li>`).join("");
      return `<div><div class="track-lab"><span class="dot ${k.toLowerCase()}"></span>${t("route" + k)} — ${tr.name || t("unnamed")} · ${nf(uDist(tr.distKm), 1)} ${distU()}</div><div class="track">${bands}</div><ul class="clist">${list || `<li style="border:none" class="empty">${t("noClimbs")}</li>`}</ul></div>`;
    }).join("");
  }

  // ---------------- orchestration ----------------
  function renderAll() { renderStats(); drawProfile(); drawSens(); renderClimbs(); updateStatHint(); }
  function recompute() { state.A = state.rawA ? process(state.rawA) : null; state.B = state.rawB ? process(state.rawB) : null; renderAll(); }

  // ---------------- wiring ----------------
  function bindKnob(id, key, metricDec) {
    const el = $(id);
    el.addEventListener("input", () => { opts[key] = parseFloat(el.value); $(id + "V").textContent = knobText(opts[key], metricDec); recompute(); });
  }
  bindKnob("resample", "resample", 0); bindKnob("smooth", "smooth", 0); bindKnob("thresh", "thresh", 1);

  $("presets").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    opts.resample = +b.dataset.r; opts.smooth = +b.dataset.s; opts.thresh = +b.dataset.t;
    $("resample").value = b.dataset.r; $("smooth").value = b.dataset.s; $("thresh").value = b.dataset.t;
    updateKnobLabels(); recompute();
  });

  function loadFile(file, slot) {
    const reader = new FileReader();
    reader.onload = () => {
      try { const track = parseGPX(reader.result); state["raw" + slot] = track; state["meta" + slot] = { title: track.name || file.name, file: file.name, pts: track.pts.length }; renderDropLabels(); recompute(); }
      catch (e) { state["meta" + slot] = null; state["raw" + slot] = null; $("name" + slot).textContent = t("readErr"); $("sub" + slot).textContent = file.name; recompute(); }
    };
    reader.readAsText(file);
  }
  function wireDrop(dropId, inputId, slot) {
    const drop = $(dropId), input = $(inputId);
    drop.addEventListener("click", () => input.click());
    drop.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); input.click(); } });
    input.addEventListener("change", () => { if (input.files[0]) loadFile(input.files[0], slot); });
    drop.addEventListener("dragover", e => { e.preventDefault(); drop.classList.add("over"); });
    drop.addEventListener("dragleave", () => drop.classList.remove("over"));
    drop.addEventListener("drop", e => { e.preventDefault(); drop.classList.remove("over"); if (e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0], slot); });
  }
  wireDrop("dropA", "fileA", "A"); wireDrop("dropB", "fileB", "B");

  // unit segmented
  $("unitGroup").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    unit = b.dataset.unit; localStorage.setItem("gpx.unit", unit);
    $("unitGroup").querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
    updateKnobLabels(); renderAll();
  });
  // language flags
  $("langGroup").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    lang = b.dataset.lang; localStorage.setItem("gpx.lang", lang);
    $("langGroup").querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
    applyStatic(); renderAll();
  });
  function syncToggleUI() {
    $("unitGroup").querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.unit === unit)));
    $("langGroup").querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.lang === lang)));
  }

  let rz; window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { drawProfile(); drawSens(); }, 120); });
  const mq = window.matchMedia("(prefers-color-scheme: dark)");
  mq.addEventListener && mq.addEventListener("change", () => { drawProfile(); drawSens(); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { drawProfile(); drawSens(); });

  // init
  syncToggleUI();
  applyStatic();
  recompute();
})();
</script>
</body>
</html>
