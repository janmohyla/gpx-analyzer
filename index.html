  /* ---------------- Material Design 3 tokens — seed: terrain green ---------------- */
  :root {
    --md-primary:#4C662B; --md-on-primary:#FFFFFF; --md-primary-container:#CDEDA3; --md-on-primary-container:#0F2000;
    --md-secondary:#586249; --md-on-secondary:#FFFFFF; --md-secondary-container:#DCE7C8; --md-on-secondary-container:#151E0B;
    --md-tertiary:#386663; --md-on-tertiary:#FFFFFF; --md-tertiary-container:#BCECE7; --md-on-tertiary-container:#00201E;
    --md-error:#BA1A1A; --md-error-container:#FFDAD6; --md-on-error-container:#410002;
    --md-surface:#F9FAEF; --md-on-surface:#1A1C16; --md-surface-variant:#E1E4D5; --md-on-surface-variant:#44483D;
    --md-outline:#75796C; --md-outline-variant:#C5C8BA;
    --md-s-lowest:#FFFFFF; --md-s-low:#F3F4E9; --md-s:#EDEEE3; --md-s-high:#E7E9DD; --md-s-highest:#E1E3D7;
    --md-inverse-surface:#2F312A; --md-inverse-on-surface:#F1F2E6;

    /* route data colours (categorical, kept independent of the MD3 palette) */
    --a:#C47F22; --a-soft:rgba(196,127,34,.14);
    --b:#1F8F81; --b-soft:rgba(31,143,129,.14);
    --steep:#BA1A1A;

    /* shape scale */
    --r-xs:4px; --r-s:8px; --r-m:12px; --r-l:16px; --r-xl:28px; --r-full:999px;
    --shadow-1:0 1px 2px rgba(0,0,0,.10), 0 1px 3px 1px rgba(0,0,0,.06);
    --shadow-2:0 1px 2px rgba(0,0,0,.12), 0 2px 6px 2px rgba(0,0,0,.08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --md-primary:#B1D18A; --md-on-primary:#1F3701; --md-primary-container:#354E16; --md-on-primary-container:#CDEDA3;
      --md-secondary:#BFCBAD; --md-on-secondary:#2A331E; --md-secondary-container:#404A33; --md-on-secondary-container:#DCE7C8;
      --md-tertiary:#A0D0CB; --md-on-tertiary:#003734; --md-tertiary-container:#1F4E4B; --md-on-tertiary-container:#BCECE7;
      --md-error:#FFB4AB; --md-error-container:#93000A; --md-on-error-container:#FFDAD6;
      --md-surface:#12140E; --md-on-surface:#E2E3D8; --md-surface-variant:#44483D; --md-on-surface-variant:#C5C8BA;
      --md-outline:#8F9285; --md-outline-variant:#44483D;
      --md-s-lowest:#0C0F09; --md-s-low:#1A1C16; --md-s:#1E201A; --md-s-high:#282B24; --md-s-highest:#33362E;
      --md-inverse-surface:#E2E3D8; --md-inverse-on-surface:#2F312A;
      --a:#E0A244; --a-soft:rgba(224,162,68,.16);
      --b:#35B3A2; --b-soft:rgba(53,179,162,.16);
      --steep:#FFB4AB;
      --shadow-1:0 1px 2px rgba(0,0,0,.4), 0 1px 3px 1px rgba(0,0,0,.25);
      --shadow-2:0 1px 3px rgba(0,0,0,.45), 0 4px 8px 3px rgba(0,0,0,.30);
    }
  }
  :root[data-theme="light"] {
    --md-primary:#4C662B; --md-on-primary:#FFFFFF; --md-primary-container:#CDEDA3; --md-on-primary-container:#0F2000;
    --md-secondary:#586249; --md-on-secondary:#FFFFFF; --md-secondary-container:#DCE7C8; --md-on-secondary-container:#151E0B;
    --md-tertiary:#386663; --md-on-tertiary:#FFFFFF; --md-tertiary-container:#BCECE7; --md-on-tertiary-container:#00201E;
    --md-error:#BA1A1A; --md-error-container:#FFDAD6; --md-on-error-container:#410002;
    --md-surface:#F9FAEF; --md-on-surface:#1A1C16; --md-surface-variant:#E1E4D5; --md-on-surface-variant:#44483D;
    --md-outline:#75796C; --md-outline-variant:#C5C8BA;
    --md-s-lowest:#FFFFFF; --md-s-low:#F3F4E9; --md-s:#EDEEE3; --md-s-high:#E7E9DD; --md-s-highest:#E1E3D7;
    --md-inverse-surface:#2F312A; --md-inverse-on-surface:#F1F2E6;
    --a:#C47F22; --a-soft:rgba(196,127,34,.14); --b:#1F8F81; --b-soft:rgba(31,143,129,.14); --steep:#BA1A1A;
    --shadow-1:0 1px 2px rgba(0,0,0,.10), 0 1px 3px 1px rgba(0,0,0,.06);
    --shadow-2:0 1px 2px rgba(0,0,0,.12), 0 2px 6px 2px rgba(0,0,0,.08);
  }
  :root[data-theme="dark"] {
    --md-primary:#B1D18A; --md-on-primary:#1F3701; --md-primary-container:#354E16; --md-on-primary-container:#CDEDA3;
    --md-secondary:#BFCBAD; --md-on-secondary:#2A331E; --md-secondary-container:#404A33; --md-on-secondary-container:#DCE7C8;
    --md-tertiary:#A0D0CB; --md-on-tertiary:#003734; --md-tertiary-container:#1F4E4B; --md-on-tertiary-container:#BCECE7;
    --md-error:#FFB4AB; --md-error-container:#93000A; --md-on-error-container:#FFDAD6;
    --md-surface:#12140E; --md-on-surface:#E2E3D8; --md-surface-variant:#44483D; --md-on-surface-variant:#C5C8BA;
    --md-outline:#8F9285; --md-outline-variant:#44483D;
    --md-s-lowest:#0C0F09; --md-s-low:#1A1C16; --md-s:#1E201A; --md-s-high:#282B24; --md-s-highest:#33362E;
    --md-inverse-surface:#E2E3D8; --md-inverse-on-surface:#2F312A;
    --a:#E0A244; --a-soft:rgba(224,162,68,.16); --b:#35B3A2; --b-soft:rgba(53,179,162,.16); --steep:#FFB4AB;
    --shadow-1:0 1px 2px rgba(0,0,0,.4), 0 1px 3px 1px rgba(0,0,0,.25);
    --shadow-2:0 1px 3px rgba(0,0,0,.45), 0 4px 8px 3px rgba(0,0,0,.30);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--md-surface);
    color: var(--md-on-surface);
    font-family: 'Roboto', system-ui, -apple-system, "Segoe UI", sans-serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    font-feature-settings: "kern" 1;
  }
  .num { font-variant-numeric: tabular-nums; }

  /* MD3 type scale */
  .t-eyebrow { font-size: 11px; font-weight: 500; letter-spacing: .1em; text-transform: uppercase; color: var(--md-on-surface-variant); }
  .t-title-l { font-size: 22px; font-weight: 500; letter-spacing: 0; }
  .t-headline { font-size: clamp(24px, 3.6vw, 32px); font-weight: 400; letter-spacing: -0.01em; text-wrap: balance; }
  .t-title-m { font-size: 16px; font-weight: 500; }
  .t-label { font-size: 11px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--md-on-surface-variant); }
  .t-body { font-size: 14px; font-weight: 400; }

  /* ---------------- top app bar ---------------- */
  .app-bar {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
    padding: 10px clamp(14px, 3vw, 28px);
    background: var(--md-surface);
    border-bottom: 1px solid var(--md-outline-variant);
  }
  .app-bar .brand { display: flex; align-items: center; gap: 12px; }
  .app-bar .brand .mark {
    width: 34px; height: 34px; border-radius: var(--r-s); flex: none;
    background: var(--md-primary-container); color: var(--md-on-primary-container);
    display: grid; place-items: center;
  }
  .app-bar .brand h1 { margin: 0; color: var(--md-on-surface); }
  .app-bar .actions { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }

  /* MD3 outlined "pill" button (PDF export) */
  .pill-btn { position: relative; display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 16px 0 14px; border: 1px solid var(--md-outline); border-radius: var(--r-full); background: transparent; color: var(--md-on-surface); font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer; }
  .pill-btn svg { width: 18px; height: 18px; }
  .pill-btn::before { content: ""; position: absolute; inset: 0; border-radius: inherit; background: var(--md-on-surface); opacity: 0; transition: opacity .12s; }
  .pill-btn:hover::before { opacity: .08; }
  .pill-btn:focus-visible { outline: 2px solid var(--md-primary); outline-offset: 2px; }
  .pill-btn:disabled { opacity: .55; cursor: default; }
  .pill-btn:disabled::before { opacity: 0; }

  /* header icon button (PNG export) */
  .hd-right { display: flex; align-items: center; gap: 12px; }
  .icon-btn { position: relative; display: grid; place-items: center; width: 32px; height: 32px; border: none; border-radius: var(--r-full); background: transparent; color: var(--md-on-surface-variant); cursor: pointer; padding: 0; flex: none; }
  .icon-btn svg { width: 18px; height: 18px; }
  .icon-btn::before { content: ""; position: absolute; inset: 0; border-radius: inherit; background: var(--md-on-surface); opacity: 0; transition: opacity .12s; }
  .icon-btn:hover { color: var(--md-on-surface); }
  .icon-btn:hover::before { opacity: .08; }
  .icon-btn:focus-visible { outline: 2px solid var(--md-primary); outline-offset: 2px; }
  .icon-btn:disabled { opacity: .4; cursor: default; }
  .icon-btn:disabled::before { opacity: 0; }

  /* MD3 segmented button */
  .segmented { display: inline-flex; border: 1px solid var(--md-outline); border-radius: var(--r-full); overflow: hidden; height: 40px; }
  .segmented .seg {
    position: relative; display: inline-flex; align-items: center; gap: 6px;
    border: none; background: transparent; color: var(--md-on-surface-variant);
    font-family: inherit; font-size: 14px; font-weight: 500; letter-spacing: .01em;
    padding: 0 16px; cursor: pointer; white-space: nowrap;
  }
  .segmented .seg + .seg { border-left: 1px solid var(--md-outline); }
  .segmented .seg::before { content: ""; position: absolute; inset: 0; background: currentColor; opacity: 0; transition: opacity .12s; }
  .segmented .seg:hover::before { opacity: .08; }
  .segmented .seg:focus-visible { outline: 2px solid var(--md-primary); outline-offset: -2px; }
  .segmented .seg[aria-pressed="true"] { background: var(--md-secondary-container); color: var(--md-on-secondary-container); }
  .segmented .seg .check { width: 18px; height: 18px; display: none; }
  .segmented .seg[aria-pressed="true"] .check { display: inline-block; }

  /* language flags */
  .lang { display: inline-flex; gap: 4px; }
  .flag-btn {
    position: relative; width: 40px; height: 40px; border-radius: var(--r-full);
    border: none; background: transparent; cursor: pointer; padding: 0;
    display: grid; place-items: center;
  }
  .flag-btn::before { content: ""; position: absolute; inset: 0; border-radius: inherit; background: var(--md-on-surface); opacity: 0; transition: opacity .12s; }
  .flag-btn:hover::before { opacity: .08; }
  .flag-btn:focus-visible { outline: 2px solid var(--md-primary); outline-offset: 2px; }
  .flag-btn svg { width: 26px; height: auto; border-radius: 3px; display: block; box-shadow: 0 0 0 1px rgba(0,0,0,.12); transition: opacity .12s, transform .12s; }
  .flag-btn[aria-pressed="false"] svg { opacity: .38; filter: saturate(.6); }
  .flag-btn[aria-pressed="true"] { background: var(--md-secondary-container); }
  .flag-btn[aria-pressed="true"] svg { transform: scale(1.02); }

  /* ---------------- layout ---------------- */
  .wrap { max-width: 1040px; margin: 0 auto; padding: clamp(16px, 3vw, 32px); display: flex; flex-direction: column; gap: 20px; }
  .hero { display: flex; flex-direction: column; gap: 8px; }
  .hero .lede { margin: 0; color: var(--md-on-surface-variant); max-width: 64ch; font-size: 15px; }
  .hero .lede b { color: var(--md-on-surface); font-weight: 500; }

  /* MD3 cards (filled) */
  .card { background: var(--md-s-low); border: 1px solid var(--md-outline-variant); border-radius: var(--r-l); overflow: hidden; }
  .card > .hd { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 16px 20px 12px; }
  .card > .hd h2 { margin: 0; color: var(--md-on-surface); }
  .card > .hd .hint { color: var(--md-on-surface-variant); font-size: 12px; }
  .card > .bd { padding: 8px 20px 20px; }

  /* file drops */
  .drops { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 640px) { .drops { grid-template-columns: 1fr; } }
  .drop {
    border: 1.5px dashed var(--md-outline); border-radius: var(--r-m);
    background: var(--md-s); padding: 16px; cursor: pointer;
    display: flex; flex-direction: column; gap: 6px; min-height: 96px; justify-content: center;
    transition: border-color .15s, background .15s;
  }
  .drop:focus-visible { outline: 2px solid var(--md-primary); outline-offset: 2px; }
  .drop.a { border-left: 4px solid var(--a); }
  .drop.b { border-left: 4px solid var(--b); }
  .drop.over { background: var(--md-s-high); border-color: var(--md-primary); }
  .drop .tag { font-size: 11px; font-weight: 500; letter-spacing: .1em; text-transform: uppercase; }
  .drop.a .tag { color: var(--a); } .drop.b .tag { color: var(--b); }
  .drop .fname { font-weight: 500; font-size: 15px; word-break: break-word; color: var(--md-on-surface); }
  .drop .sub { font-size: 12px; color: var(--md-on-surface-variant); }

  /* knobs */
  .controls { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; }
  @media (max-width: 680px) { .controls { grid-template-columns: 1fr; } }
  .knob { display: flex; flex-direction: column; gap: 8px; }
  .knob .k-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .knob label { font-size: 14px; font-weight: 500; color: var(--md-on-surface); }
  .knob .k-val { font-size: 13px; font-weight: 500; color: var(--md-primary); }
  .knob .k-desc { font-size: 12px; color: var(--md-on-surface-variant); line-height: 1.45; }

  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 20px; background: transparent; cursor: pointer; }
  input[type=range]:focus { outline: none; }
  input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: var(--r-full); background: var(--md-secondary-container); }
  input[type=range]::-moz-range-track { height: 4px; border-radius: var(--r-full); background: var(--md-secondary-container); }
  input[type=range]::-moz-range-progress { height: 4px; border-radius: var(--r-full); background: var(--md-primary); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; margin-top: -7px; border-radius: 50%; background: var(--md-primary); border: 3px solid var(--md-s-low); box-shadow: 0 0 0 1px var(--md-primary); }
  input[type=range]::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; background: var(--md-primary); border: 3px solid var(--md-s-low); box-shadow: 0 0 0 1px var(--md-primary); }
  input[type=range]:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 1px var(--md-primary), 0 0 0 6px color-mix(in srgb, var(--md-primary) 20%, transparent); }

  .presets { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
  .chip {
    position: relative; font-family: inherit; font-size: 13px; font-weight: 500;
    background: transparent; color: var(--md-on-surface-variant);
    border: 1px solid var(--md-outline); border-radius: var(--r-s); padding: 7px 12px; cursor: pointer;
  }
  .chip::before { content: ""; position: absolute; inset: 0; border-radius: inherit; background: var(--md-on-surface); opacity: 0; transition: opacity .12s; }
  .chip:hover::before { opacity: .08; }
  .chip:focus-visible { outline: 2px solid var(--md-primary); outline-offset: 2px; }

  /* drop badges + remove */
  .drop-top { display: flex; align-items: center; gap: 8px; }
  .badge { font-size: 10px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; padding: 2px 7px; border-radius: var(--r-xs); }
  .badge.req { background: var(--md-primary-container); color: var(--md-on-primary-container); }
  .badge.opt { background: transparent; color: var(--md-on-surface-variant); border: 1px solid var(--md-outline-variant); }
  .drop-clear { margin-left: auto; display: inline-flex; align-items: center; gap: 4px; font-family: inherit; font-size: 12px; font-weight: 500; color: var(--md-on-surface-variant); background: transparent; border: 1px solid var(--md-outline); border-radius: var(--r-full); padding: 3px 10px 3px 8px; cursor: pointer; }
  .drop-clear[hidden] { display: none; }
  .drop-clear:hover { color: var(--md-error); border-color: var(--md-error); }
  .drop-clear:focus-visible { outline: 2px solid var(--md-primary); outline-offset: 2px; }
  .drop-clear svg { width: 14px; height: 14px; }

  /* (i) info tooltips on knob headers */
  .k-head { display: inline-flex; align-items: center; gap: 6px; }
  .k-info { position: relative; display: inline-flex; }
  .info-dot { width: 16px; height: 16px; border-radius: 50%; border: 1px solid var(--md-outline); background: transparent; color: var(--md-on-surface-variant); font: 700 10px/1 Georgia, "Times New Roman", serif; cursor: pointer; padding: 0; display: grid; place-items: center; font-style: italic; }
  .info-dot:hover, .info-dot[aria-expanded="true"] { border-color: var(--md-primary); color: var(--md-primary); }
  .info-dot:focus-visible { outline: 2px solid var(--md-primary); outline-offset: 2px; }
  /* the inline .info-pop is now just a hidden text holder (i18n target); the visible
     tooltip is #infoFloat, a body-level fixed layer that no stacking context can trap */
  .info-pop { display: none; }
  #infoFloat { position: fixed; z-index: 2147483000; max-width: 260px; padding: 10px 12px; background: var(--md-s-highest); color: var(--md-on-surface); border: 1px solid var(--md-outline-variant); border-radius: var(--r-s); box-shadow: var(--shadow-2); font-size: 12px; font-weight: 400; line-height: 1.45; opacity: 0; visibility: hidden; transform: translateY(-4px); transition: opacity .12s, transform .12s, visibility .12s; pointer-events: none; }
  #infoFloat.show { opacity: 1; visibility: visible; transform: translateY(0); }
  @media (prefers-reduced-motion: reduce) { #infoFloat { transition: none; } }

  /* stats */
  .stats { display: grid; grid-template-columns: 1.3fr 1fr 1fr 1fr; }
  .stats .cell { padding: 12px 14px; border-bottom: 1px solid var(--md-outline-variant); display: flex; align-items: center; font-size: 14px; }
  .stats .cell.measure { color: var(--md-on-surface-variant); }
  .stats .cell.n { justify-content: flex-end; font-weight: 500; }
  .stats .cell.head { font-size: 11px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--md-on-surface-variant); border-bottom: 1px solid var(--md-outline); }
  .stats .cell.head.n { justify-content: flex-end; }
  .stats .cell:nth-last-child(-n+4) { border-bottom: none; }

    lInit = true; rebuildLeafletRoutes();
  }
  function updateBasemapBtn() { $("basemapBtn").textContent = basemapOn ? t("hideBasemap") : t("showBasemap"); }
  async function toggleBasemap() {
    basemapOn = !basemapOn;
    $("mapCanvas").style.display = basemapOn ? "none" : "block";
    $("leaflet").style.display = basemapOn ? "block" : "none";
    $("basemapBtn").setAttribute("aria-pressed", String(basemapOn));
    updateBasemapBtn();
    if (!basemapOn) { drawMapCanvas(); return; }
    try {
      if (!lInit) await initLeaflet(); else rebuildLeafletRoutes();
      setTimeout(() => { if (lmap) { lmap.invalidateSize(); rebuildLeafletRoutes(); } }, 60);
    } catch (e) {
      basemapOn = false; $("mapCanvas").style.display = "block"; $("leaflet").style.display = "none";
      $("basemapBtn").setAttribute("aria-pressed", "false"); updateBasemapBtn(); drawMapCanvas();
    }
  }
  function renderMap() {
    $("basemapBtn").disabled = !(state.geoA || state.geoB);
    if (lInit) rebuildLeafletRoutes();
    drawMapCanvas();
  }
  function updateMapHover() { if (basemapOn && lmap) updateLeafletMarker(); else drawMapCanvas(); }

  // ---------------- export (PNG per section + A4 PDF report) ----------------
  const EX = { profile: [1120, 340], map: [720, 640] };
  function roundRect(ctx, x, y, w, h, r) {
    if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); return; }
    ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }
  function renderToCanvas(core, w, h, scale, bg) {
    scale = scale || 2.5;
    if (bg === undefined) bg = "--md-s-low";
    const cv = document.createElement("canvas");
    cv.width = Math.round(w * scale); cv.height = Math.round(h * scale);
    const ctx = cv.getContext("2d"); ctx.setTransform(scale, 0, 0, scale, 0, 0);
    const fill = bg == null ? null : (bg[0] === "#" ? bg : css(bg));
    if (fill) { ctx.fillStyle = fill; ctx.fillRect(0, 0, w, h); }
    core(ctx, w, h);
    return cv;
  }
  // render exports with light-theme colours (readable on white PDF pages) regardless of screen theme
  async function withLightThemeAsync(fn) {
    const root = document.documentElement, prev = root.getAttribute("data-theme");
    root.setAttribute("data-theme", "light");
    try { return await fn(); } finally { if (prev) root.setAttribute("data-theme", prev); else root.removeAttribute("data-theme"); }
  }
  function downloadBlob(blob, name) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  }
  function downloadCanvas(cv, name) { cv.toBlob(b => downloadBlob(b, name), "image/png"); }
  function fileBase() {
    const n = (state.metaA && state.metaA.title) || "gpx-route";
    return n.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 40) || "gpx-route";
  }

  function climbsTracks() { return [["A", state.A], ["B", state.B]].filter(x => x[1]); }
  function climbsExportHeight() { let h = 20; for (const [, tr] of climbsTracks()) h += 22 + 22 + 16 + tr.climbs.length * 22 + 22; return Math.max(140, h + 8); }
  function drawClimbsInto(ctx, w, h) {
    const tracks = climbsTracks();
    if (!tracks.length) { softMsg(ctx, w, h, t("loadTrack")); return; }
    const padX = 20; let y = 20; ctx.textBaseline = "alphabetic";
    for (const [k, tr] of tracks) {
      ctx.fillStyle = css(k === "A" ? "--a" : "--b"); ctx.beginPath(); ctx.arc(padX + 5, y + 4, 5, 0, 7); ctx.fill();
      ctx.fillStyle = css("--md-on-surface"); ctx.font = "600 14px Roboto, sans-serif"; ctx.textAlign = "left";
      ctx.fillText(`${t("route" + k)} — ${tr.name || t("unnamed")} · ${nf(uDist(tr.distKm), 1)} ${distU()}`, padX + 18, y + 9);
      y += 22;
      const barW = w - 2 * padX, barH = 22;
      ctx.fillStyle = css("--md-s"); roundRect(ctx, padX, y, barW, barH, 6); ctx.fill();
      for (const c of tr.climbs) { const x0 = padX + (c.start / tr.distKm) * barW, ww = Math.max(2, ((c.end - c.start) / tr.distKm) * barW); ctx.fillStyle = gradColor(c.avg); ctx.fillRect(x0, y, ww, barH); }
      ctx.strokeStyle = css("--md-outline-variant"); ctx.lineWidth = 1; roundRect(ctx, padX, y, barW, barH, 6); ctx.stroke();
      y += barH + 16;
      const byPos = tr.climbs.slice().sort((a, b) => a.start - b.start);
      for (const c of byPos) {
        const by = y + 13;
        ctx.font = "13px Roboto, sans-serif"; ctx.fillStyle = css("--md-on-surface-variant"); ctx.textAlign = "left";
        ctx.fillText(`${nf(uDist(c.start), 1)} ${distU()}`, padX, by);
        ctx.fillText(`${nf(Math.round(uEle(c.len * 1000)))} ${eleU()} · ${t("avg")} ${c.avg.toFixed(1)}%`, padX + 96, by);
        const pillW = 40, pillH = 16, pillX = w - padX - pillW, pillY = y + 2;
        ctx.fillStyle = gradColor(c.maxg); roundRect(ctx, pillX, pillY, pillW, pillH, 4); ctx.fill();
        ctx.fillStyle = "#fff"; ctx.font = "600 11px Roboto, sans-serif"; ctx.textAlign = "center"; ctx.fillText(`${c.maxg.toFixed(0)}%`, pillX + pillW / 2, by);
        ctx.font = "600 13px Roboto, sans-serif"; ctx.fillStyle = css("--md-on-surface"); ctx.textAlign = "right"; ctx.fillText(`+${nf(Math.round(uEle(c.gain)))} ${eleU()}`, pillX - 10, by);
        ctx.strokeStyle = css("--md-outline-variant"); ctx.globalAlpha = .5; ctx.beginPath(); ctx.moveTo(padX, y + 21); ctx.lineTo(w - padX, y + 21); ctx.stroke(); ctx.globalAlpha = 1;
        y += 22;
      }
      y += 22;
    }
  }

  function tableExportHeight() { return 32 + statRows().length * 34 + 12; }
  function drawTableInto(ctx, w, h) {
    const rows = statRows(), padX = 20; let y = 8;
    const xA = w * 0.60, xB = w * 0.80, xD = w - padX;
    ctx.textBaseline = "alphabetic";
    ctx.font = "600 12px Roboto, sans-serif"; ctx.fillStyle = css("--md-on-surface-variant");
    ctx.textAlign = "left"; ctx.fillText(t("measure").toUpperCase(), padX, y + 14);
    ctx.textAlign = "right"; ctx.fillText(t("colA"), xA, y + 14); ctx.fillText(t("colB"), xB, y + 14); ctx.fillText(t("colDelta"), xD, y + 14);
    y += 24; ctx.strokeStyle = css("--md-outline"); ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(padX, y); ctx.lineTo(w - padX, y); ctx.stroke();
    for (const r of rows) {
      const by = y + 22;
      ctx.font = "14px Roboto, sans-serif"; ctx.fillStyle = css("--md-on-surface-variant"); ctx.textAlign = "left"; ctx.fillText(r.label, padX, by);
      ctx.font = "600 14px Roboto, sans-serif"; ctx.fillStyle = css("--md-on-surface"); ctx.textAlign = "right"; ctx.fillText(r.a, xA, by); ctx.fillText(r.b, xB, by);
      ctx.fillStyle = r.dCls === "up" ? css("--steep") : r.dCls === "down" ? css("--b") : css("--md-on-surface-variant"); ctx.fillText(r.d, xD, by);
      y += 34; ctx.strokeStyle = css("--md-outline-variant"); ctx.globalAlpha = .6; ctx.beginPath(); ctx.moveTo(padX, y - 6); ctx.lineTo(w - padX, y - 6); ctx.stroke(); ctx.globalAlpha = 1;
    }
  }
  function drawHeaderInto(ctx, w, h) {
    const padX = 20; ctx.textBaseline = "alphabetic";
    ctx.fillStyle = css("--md-on-surface"); ctx.font = "700 26px Roboto, sans-serif"; ctx.textAlign = "left"; ctx.fillText(t("appTitle"), padX, 34);
    ctx.fillStyle = css("--md-on-surface-variant"); ctx.font = "14px Roboto, sans-serif";
    const sub = [state.metaA && state.metaA.title, state.metaB && state.metaB.title].filter(Boolean).join("   •   ");
    ctx.fillText(sub, padX, 58);
    ctx.textAlign = "right"; ctx.fillText(new Date().toLocaleDateString(loc()), w - padX, 34);
  }

  // composite the live Leaflet basemap (tiles + routes) into an untainted canvas
  function compositeBasemap() {
    return new Promise(res => {
      try {
        const mapEl = $("leaflet"), rect = mapEl.getBoundingClientRect(), scale = 2;
        const cv = document.createElement("canvas"); cv.width = Math.round(rect.width * scale); cv.height = Math.round(rect.height * scale);
        const ctx = cv.getContext("2d"); ctx.setTransform(scale, 0, 0, scale, 0, 0);
        ctx.fillStyle = css("--md-s") || "#e8ebe4"; ctx.fillRect(0, 0, rect.width, rect.height);
        for (const im of mapEl.querySelectorAll("img.leaflet-tile")) {
          if (!im.complete || !im.naturalWidth) continue;
          const r = im.getBoundingClientRect();
          ctx.globalAlpha = parseFloat(getComputedStyle(im).opacity) || 1;
          ctx.drawImage(im, r.left - rect.left, r.top - rect.top, r.width, r.height);
        }
        ctx.globalAlpha = 1;
        for (const [k, g] of [["A", state.geoA], ["B", state.geoB]]) {
          if (!g) continue;
          ctx.strokeStyle = css(k === "A" ? "--a" : "--b"); ctx.lineWidth = 3; ctx.lineJoin = "round"; ctx.lineCap = "round";
          ctx.beginPath(); g.lat.forEach((la, i) => { const p = lmap.latLngToContainerPoint([la, g.lon[i]]); i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y); }); ctx.stroke();
        }
        const label = "© OpenStreetMap contributors";
        ctx.font = "11px Roboto, sans-serif"; ctx.textAlign = "right"; ctx.textBaseline = "bottom";
        const tw = ctx.measureText(label).width;
        ctx.fillStyle = "rgba(255,255,255,.72)"; ctx.fillRect(rect.width - tw - 10, rect.height - 17, tw + 10, 15);
        ctx.fillStyle = "#333"; ctx.fillText(label, rect.width - 4, rect.height - 4);
        cv.getContext("2d").getImageData(0, 0, 1, 1); // throws if tainted
        res(cv);
      } catch (e) { res(null); }
    });
  }
  async function mapExportCanvas(bg) {
    if (basemapOn && lmap) { const c = await compositeBasemap(); if (c) return c; }
    return renderToCanvas((ctx, w, h) => drawMapInto(ctx, w, h, false), EX.map[0], EX.map[1], 2.5, bg);
  }

  function exportProfilePng() { if (!(state.A || state.B)) return; downloadCanvas(renderToCanvas((c, w, h) => drawProfileInto(c, w, h, false), EX.profile[0], EX.profile[1], 2.5), fileBase() + "-elevation.png"); }
  function exportClimbsPng() { if (!(state.A || state.B)) return; downloadCanvas(renderToCanvas(drawClimbsInto, 1120, climbsExportHeight(), 2.5), fileBase() + "-climbs.png"); }
  async function exportMapPng() { if (!(state.geoA || state.geoB)) return; const cv = await mapExportCanvas(); if (cv) downloadCanvas(cv, fileBase() + "-map.png"); }

  let jspdfReq = null;
  function loadJsPDF() {
    if (window.jspdf) return Promise.resolve();
    if (jspdfReq) return jspdfReq;
    jspdfReq = new Promise((res, rej) => { const s = document.createElement("script"); s.src = "vendor/jspdf/jspdf.umd.min.js"; s.onload = () => res(); s.onerror = () => rej(new Error("jspdf failed")); document.head.appendChild(s); });
    return jspdfReq;
  }
  async function exportPdf() {
    if (!(state.A || state.B)) return;
    const btn = $("pdfBtn"), span = btn.querySelector("span"), orig = span.textContent;
    btn.disabled = true; span.textContent = t("pdfWorking");
    try {
      await loadJsPDF();
      // pre-render every section on white, using light-theme colours (clean on white pages)
      const parts = await withLightThemeAsync(async () => ({
        header: renderToCanvas(drawHeaderInto, 1120, 74, 2, "#ffffff"),
        table: renderToCanvas(drawTableInto, 1120, tableExportHeight(), 2, "#ffffff"),
        profile: renderToCanvas((c, w, h) => drawProfileInto(c, w, h, false), EX.profile[0], EX.profile[1], 2, "#ffffff"),
        map: await mapExportCanvas("#ffffff"),
        climbs: renderToCanvas(drawClimbsInto, 1120, climbsExportHeight(), 2, "#ffffff")
      }));
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ unit: "mm", format: "a4", orientation: "portrait", compress: true });
      const W = 210, H = 297, M = 12, cw = W - 2 * M; let y = M;
      const place = (cv, gap) => {
        if (!cv) return; let iw = cw, ih = cw * (cv.height / cv.width); const maxH = H - 2 * M;
        if (ih > maxH) { ih = maxH; iw = maxH * (cv.width / cv.height); }
        if (y + ih > H - M) { doc.addPage(); y = M; }
        doc.addImage(cv.toDataURL("image/png"), "PNG", M, y, iw, ih, undefined, "FAST"); y += ih + (gap == null ? 4 : gap);
      };
      // section heading: transparent background, dark text + hairline rule (theme-independent)
      const titleStrip = title => renderToCanvas((ctx, w, h) => {
        ctx.fillStyle = "#1a231d"; ctx.font = "700 25px Roboto, sans-serif"; ctx.textAlign = "left"; ctx.textBaseline = "alphabetic"; ctx.fillText(title, 2, 24);
        ctx.strokeStyle = "#d6dccf"; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(2, h - 2); ctx.lineTo(w - 2, h - 2); ctx.stroke();
      }, 1120, 40, 2, "#ffffff");
      const section = (title, cv, gap) => {
        if (!cv) return;
        const ts = titleStrip(title), tH = cw * (ts.height / ts.width), iH = cw * (cv.height / cv.width);
        if (y + tH + 2 + Math.min(iH, H - 2 * M) > H - M) { doc.addPage(); y = M; }
        place(ts, 2); place(cv, gap);
      };
      place(parts.header, 5);
      section(t("compTitle"), parts.table, 8);
      section(t("profTitle"), parts.profile, 8);
      section(t("mapTitle"), parts.map, 8);
      section(t("climbsTitle"), parts.climbs, 8);
      const pages = doc.getNumberOfPages();
      for (let i = 1; i <= pages; i++) { doc.setPage(i); doc.setFont("helvetica", "normal"); doc.setFontSize(8); doc.setTextColor(150, 150, 150); doc.text(`${i} / ${pages}`, W - M, H - 6, { align: "right" }); }
      doc.save(fileBase() + "-report.pdf");
    } catch (e) { console.error(e); alert(t("pdfError")); }
    finally { btn.disabled = false; span.textContent = orig; }
  }

  // ---------------- orchestration ----------------
  function updateExportButtons() {
    const has = !!(state.A || state.B);
    $("pdfBtn").disabled = $("pngProfile").disabled = $("pngClimbs").disabled = !has;
    $("pngMap").disabled = !(state.geoA || state.geoB);
  }
  function renderAll() { renderStats(); drawProfile(); renderClimbs(); updateStatHint(); updateExportButtons(); }
  function recompute() { state.A = state.rawA ? process(state.rawA) : null; state.B = state.rawB ? process(state.rawB) : null; renderAll(); }

  // ---------------- wiring ----------------
  function bindKnob(id, key, metricDec) {
    const el = $(id);
    el.addEventListener("input", () => { opts[key] = parseFloat(el.value); $(id + "V").textContent = knobText(opts[key], metricDec); recompute(); });
  }
  bindKnob("resample", "resample", 0); bindKnob("smooth", "smooth", 0); bindKnob("thresh", "thresh", 1);

  $("presets").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    opts.resample = +b.dataset.r; opts.smooth = +b.dataset.s; opts.thresh = +b.dataset.t;
    $("resample").value = b.dataset.r; $("smooth").value = b.dataset.s; $("thresh").value = b.dataset.t;
    updateKnobLabels(); recompute();
  });

  function loadFile(file, slot) {
    const reader = new FileReader();
    reader.onload = () => {
      try { const track = parseGPX(reader.result); state["raw" + slot] = track; state["geo" + slot] = buildGeo(track); state["meta" + slot] = { title: track.name || file.name, file: file.name, pts: track.pts.length }; renderDropLabels(); recompute(); renderMap(); }
      catch (e) { state["meta" + slot] = state["raw" + slot] = state["geo" + slot] = null; $("name" + slot).textContent = t("readErr"); $("sub" + slot).textContent = file.name; recompute(); renderMap(); }
    };
    reader.readAsText(file);
  }
  function wireDrop(dropId, inputId, slot) {
    const drop = $(dropId), input = $(inputId);
    drop.addEventListener("click", () => input.click());
    drop.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); input.click(); } });
    input.addEventListener("change", () => { if (input.files[0]) loadFile(input.files[0], slot); });
    drop.addEventListener("dragover", e => { e.preventDefault(); drop.classList.add("over"); });
    drop.addEventListener("dragleave", () => drop.classList.remove("over"));
    drop.addEventListener("drop", e => { e.preventDefault(); drop.classList.remove("over"); if (e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0], slot); });
  }
  wireDrop("dropA", "fileA", "A"); wireDrop("dropB", "fileB", "B");

  // remove Route B (so a single track can be inspected on its own)
  $("clearB").addEventListener("click", e => {
    e.stopPropagation();
    state.rawB = state.metaB = state.B = state.geoB = null;
    $("fileB").value = "";
    renderDropLabels(); recompute(); renderMap();
  });
  $("basemapBtn").addEventListener("click", toggleBasemap);
  $("pdfBtn").addEventListener("click", exportPdf);
  $("pngProfile").addEventListener("click", exportProfilePng);
  $("pngMap").addEventListener("click", exportMapPng);
  $("pngClimbs").addEventListener("click", exportClimbsPng);

  // (i) info tooltips — shown in #infoFloat, a body-level fixed layer, so they can never
  // be trapped behind other UI by a stacking context (zoom / extensions / grid quirks).
  const infoFloat = $("infoFloat");
  const infoDots = [...document.querySelectorAll(".info-dot")];
  let infoOpen = null;
  function positionInfo(dot) {
    const r = dot.getBoundingClientRect();
    infoFloat.style.left = "0px"; infoFloat.style.top = "0px"; // reset before measuring
    const fw = infoFloat.offsetWidth, fh = infoFloat.offsetHeight;
    const left = Math.max(8, Math.min(r.left + r.width / 2 - fw / 2, window.innerWidth - fw - 8));
    let top = r.bottom + 8;
    if (top + fh > window.innerHeight - 8) top = Math.max(8, r.top - fh - 8); // flip above if no room below
    infoFloat.style.left = left + "px"; infoFloat.style.top = top + "px";
  }
  function showInfo(dot) {
    const pop = dot.parentNode.querySelector(".info-pop");
    infoFloat.textContent = pop ? pop.textContent : "";
    infoFloat.classList.add("show");
    positionInfo(dot);
    infoDots.forEach(b => b.setAttribute("aria-expanded", String(b === dot)));
    infoOpen = dot;
  }
  function hideInfo() { if (!infoOpen) return; infoFloat.classList.remove("show"); infoDots.forEach(b => b.setAttribute("aria-expanded", "false")); infoOpen = null; }
  infoDots.forEach(dot => {
    dot.addEventListener("mouseenter", () => showInfo(dot));
    dot.addEventListener("mouseleave", () => { if (infoOpen === dot) hideInfo(); });
    dot.addEventListener("focus", () => showInfo(dot));
    dot.addEventListener("blur", () => { if (infoOpen === dot) hideInfo(); });
    dot.addEventListener("click", e => { e.stopPropagation(); infoOpen === dot ? hideInfo() : showInfo(dot); });
  });
  document.addEventListener("click", hideInfo);
  window.addEventListener("scroll", hideInfo, true);
  window.addEventListener("resize", hideInfo);

  // unit segmented
  $("unitGroup").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    unit = b.dataset.unit; localStorage.setItem("gpx.unit", unit);
    $("unitGroup").querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
    updateKnobLabels(); renderAll();
  });
  // language flags
  $("langGroup").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    lang = b.dataset.lang; localStorage.setItem("gpx.lang", lang);
    $("langGroup").querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
    applyStatic(); renderAll();
  });
  function syncToggleUI() {
    $("unitGroup").querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.unit === unit)));
    $("langGroup").querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.lang === lang)));
  }

  let rz; window.addEventListener("resize", () => {
    drawProfile(); drawMapCanvas(); if (basemapOn && lmap) lmap.invalidateSize();
    clearTimeout(rz); rz = setTimeout(() => { drawProfile(); drawMapCanvas(); }, 120);
  });
  const mq = window.matchMedia("(prefers-color-scheme: dark)");
  mq.addEventListener && mq.addEventListener("change", () => { drawProfile(); drawMapCanvas(); if (basemapOn && lmap) rebuildLeafletRoutes(); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { drawProfile(); drawMapCanvas(); });

  // init
  syncToggleUI();
  applyStatic();
  recompute();
  renderMap();
})();
</script>
</body>
</html>
